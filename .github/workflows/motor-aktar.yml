# Tek seferlik geçiş: eski düzende karar verilmiş adayları motor defterine aktarır. Geçiş bitince bu dosya silinir.
name: Motor aktarımı

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aktar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: sett kayıtlarını aktar
        env:
          MOTOR_URL: ${{ vars.MOTOR_URL }}
          MOTOR_ANAHTARI: ${{ secrets.MOTOR_ANAHTARI }}
        run: node scripts/nyheter/sett-aktar.mjs
