# Siteyi GitHub Actions'ta derleyip Cloudflare'e gönderir; Cloudflare'in ücretsiz derleme dakikası harcanmaz.
# Elle yapılan push'larda içerik ya da site kodu değiştiyse kendiliğinden çalışır. Botun push'u (GITHUB_TOKEN)
# push tetiklemediği için bot, yeni haber yazdığında bu iş akışını "gh workflow run" ile başlatır.
# "[skip ci]" içeren commit'ler (yalnız durum dosyası) yayın başlatmaz.
name: Yayınla

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/yayinla.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Yayından sonra Facebook/Instagram paylaşımını (sosial.yml) başlatmak için.
  actions: write

# Sırada bekleyen yayın varsa eskisi iptal edilir; her yayın dalın en son hâlini derler.
concurrency:
  group: yayinla
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      # Facebook/Instagram post ve story görselleri (Fjord): son haberler için public/sosial/ altına (scripts/sosial).
      # Hata yayını durdurmaz; görseli olmayan haber paylaşılmaz.
      - name: Sosyal medya görselleri
        continue-on-error: true
        run: node scripts/sosial/bilder.mjs

      - name: Derle
        run: npm run build

      - name: Cloudflare'e gönder
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.34.0 deploy

      # Cloudflare ücretsiz planında bir sürüm en fazla 20.000 dosya olabilir; sınıra yaklaşınca uyarır.
      - name: Dosya sayısı
        run: |
          n=$(find dist -type f | wc -l)
          echo "dist: $n dosya (sınır 20.000)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 15000 ]; then echo "::warning::dist $n dosya; Cloudflare ücretsiz sınırı 20.000"; fi

      # Yeni haberleri arama motorlarına bildirir (IndexNow: Bing, Yandex, Seznam, Naver). Hata yayını etkilemez.
      - name: IndexNow
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/indexnow.mjs

      # Facebook/Instagram paylaşımı. sosial.yml'yi "workflow_run" ile tetiklemek işe yaramıyor: GitHub, botun
      # (GITHUB_TOKEN) başlattığı yayınlar bitince workflow_run olayı üretmiyor. workflow_dispatch ise serbest.
      - name: Sosyal medya paylaşımını başlat
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sosial.yml --ref "${{ github.ref_name }}" -f mod=paylas
