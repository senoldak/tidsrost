# Siteyi GitHub Actions'ta derleyip Cloudflare'e gönderir; Cloudflare'in ücretsiz derleme dakikası harcanmaz.
# Elle yapılan push'larda içerik ya da site kodu değiştiyse kendiliğinden çalışır. Botun push'u (GITHUB_TOKEN)
# push tetiklemediği için bot, yeni haber yazdığında bu iş akışını "gh workflow run" ile başlatır.
# "[skip ci]" içeren commit'ler (yalnız durum dosyası) yayın başlatmaz.
name: Yayınla

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/yayinla.yml'
  workflow_dispatch:

permissions:
  contents: read

# Sırada bekleyen yayın varsa eskisi iptal edilir; her yayın dalın en son hâlini derler.
concurrency:
  group: yayinla
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Derle
        run: npm run build

      - name: Cloudflare'e gönder
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.34.0 deploy
