# Açık kamu verilerinden haber üretir ve repoya ekler.
# Cloudflare yeni commit'i görünce siteyi otomatik yeniden derler.
# Zamanlama Cloudflare'deki tidsur Worker'ındadır (Oslo saatiyle 08, 10 … 22, 00, 02; bkz. tidsur/README.md).
# GitHub'ın cron'u UTC'dir ve yaz/kış saatini izlemez, bu yüzden burada schedule yok.
name: Nyhetsbot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyhetsbot
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Sıradaki çalışma tetiklendiği anki commit'i değil, dalın en son hâlini alır; yoksa eski görülen listesiyle aynı haberleri yeniden yazar.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm

      # Kapak resimlerini PNG'ye çevirmek için sharp gerekiyor (bkz. scripts/nyheter/bilde.mjs).
      - name: Installer avhengigheter
        run: npm ci --no-audit --no-fund

      - name: Hent nyheter
        id: hent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAKS_PER_KJORING: ${{ vars.MAKS_PER_KJORING }}
        run: node scripts/nyheter/hent-nyheter.mjs

      - name: Commit
        run: |
          git config user.name "tidsrost-nyhetsbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/haberler scripts/nyheter/sett.json
          if git diff --cached --quiet; then
            echo "Ingen endringer."
            exit 0
          fi
          # Sadece durum dosyası değiştiyse siteyi boşuna yeniden derletme.
          if [ "${{ steps.hent.outputs.antall }}" = "0" ]; then
            git commit -m "Nyhetsbot: oppdater tilstand [skip ci]"
          else
            git commit -m "Nyhetsbot: ${{ steps.hent.outputs.antall }} nye saker"
          fi
          git pull --rebase
          git push

      # Nye saker til Telegram-kanalen med omslagsbilde. Venter til saken er publisert (lenken svarer 200),
      # og lagrer listen over sendte saker med [skip ci].
      # Her kjøring: også saker som ikke kom frem forrige gang (f.eks. manglende kanaltilgang) prøves igjen.
      - name: Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL: ${{ vars.TELEGRAM_KANAL }}
        run: |
          node scripts/nyheter/telegram.mjs
          git add scripts/nyheter/telegram-sendt.json
          if ! git diff --cached --quiet; then
            git commit -m "Telegram: sendte saker [skip ci]"
            git pull --rebase
            git push
          fi
