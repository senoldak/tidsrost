# 2 saatte bir açık kamu verilerinden haber üretir ve repoya ekler.
# Cloudflare yeni commit'i görünce siteyi otomatik yeniden derler.
name: Nyhetsbot

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nyhetsbot
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Hent nyheter
        id: hent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAKS_PER_KJORING: ${{ vars.MAKS_PER_KJORING }}
        run: node scripts/nyheter/hent-nyheter.mjs

      - name: Commit
        run: |
          git config user.name "tidsrost-nyhetsbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/haberler scripts/nyheter/sett.json
          if git diff --cached --quiet; then
            echo "Ingen endringer."
            exit 0
          fi
          # Sadece durum dosyası değiştiyse siteyi boşuna yeniden derletme.
          if [ "${{ steps.hent.outputs.antall }}" = "0" ]; then
            git commit -m "Nyhetsbot: oppdater tilstand [skip ci]"
          else
            git commit -m "Nyhetsbot: ${{ steps.hent.outputs.antall }} nye saker"
          fi
          git pull --rebase
          git push
