<text x="471.2" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">24,5 %</text>
<line x1="240" x2="240" y1="98" y2="204" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="240" y2="240" stroke="#dcded8" stroke-width="1"/>
<text x="24" y="258" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Kilde: NORLA – Senter for norsk litteratur i utlandet</text>
<text x="736" y="258" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16191c">tidsrøst</text>
