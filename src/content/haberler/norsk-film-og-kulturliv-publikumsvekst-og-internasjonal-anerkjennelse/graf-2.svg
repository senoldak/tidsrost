<text x="24" y="40" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="650" fill="#16191c">Norsk litteratureksport støttet av NORLA etter sjanger (2025)</text>
<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Fordeling av over 580 bokutgivelser oversatt fra norsk til fremmedspråk</text>
<text x="230" y="119" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Skjønnlitteratur for voksne og krim</text>
