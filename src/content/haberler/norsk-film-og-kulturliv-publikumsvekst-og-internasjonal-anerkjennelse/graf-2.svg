<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" role="img" aria-label="Norsk litteratureksport støttet av NORLA etter sjanger (2025)">
<title>Norsk litteratureksport støttet av NORLA etter sjanger (2025)</title>
