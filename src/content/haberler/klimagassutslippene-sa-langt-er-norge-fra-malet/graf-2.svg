<line x1="254.60000000000002" x2="254.60000000000002" y1="96" y2="368" stroke="#16191c" stroke-width="1"/>
<text x="24" y="380" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Oppvarming gjelder andre næringer og husholdninger. Luftfart og sjøfart gjelder innenriks.</text>
