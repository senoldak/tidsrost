<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Millioner tonn CO₂-ekvivalenter. Foreløpige tall</text>
<text x="244.60000000000002" y="117" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#16191c">Olje- og gassutvinning</text>
