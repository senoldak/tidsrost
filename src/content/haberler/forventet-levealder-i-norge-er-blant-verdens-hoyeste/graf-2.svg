<text x="566.2" y="155" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">81,6 år</text>
<text x="230" y="191" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Kvinner ved fylte 65 år</text>
<rect x="240" y="176" width="338.9" height="20" fill="#1f5f99"/>
<text x="586.9" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">86,9 år</text>
<text x="230" y="227" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Menn ved fylte 65 år</text>
<rect x="240" y="212" width="330.3" height="20" fill="#1f5f99"/>
<text x="578.3" y="227" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">84,7 år</text>
<line x1="240" x2="240" y1="98" y2="240" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="276" y2="276" stroke="#dcded8" stroke-width="1"/>
