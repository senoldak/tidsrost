<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Registrerte idrettsanlegg i Norge for vinter- og helårsaktivitet">
<title>Registrerte idrettsanlegg i Norge for vinter- og helårsaktivitet</title>
<rect width="760" height="350" fill="#fdfdfb"/>
<rect x="0" y="0" width="760" height="2" fill="#16191c"/>
<text x="24" y="40" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="650" fill="#16191c">Registrerte idrettsanlegg i Norge for vinter- og helårsaktivitet</text>
<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Utvalgte anleggskategorier i Nasjonalt anleggsregister (antall anlegg/traséer)</text>
<text x="230" y="119" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Lysløyper og turløyper for ski/trim</text>
<rect x="240" y="104" width="350.8" height="20" fill="#16191c"/>
<text x="598.8" y="119" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">3 850 anlegg</text>
<text x="230" y="155" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Fotballbaner (kunstgress og naturgress)</text>
<rect x="240" y="140" width="375.4" height="20" fill="#1f5f99"/>
<text x="623.4" y="155" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">4 120 anlegg</text>
<text x="230" y="191" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Nærmiljøanlegg og aktivitetsparker</text>
<rect x="240" y="176" width="331.6" height="20" fill="#1f5f99"/>
<text x="579.6" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">3 640 anlegg</text>
<text x="230" y="227" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Idrettshaller og flerbrukshaller</text>
<rect x="240" y="212" width="144.0" height="20" fill="#1f5f99"/>
<text x="392.0" y="227" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">1 580 anlegg</text>
<text x="230" y="263" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Alpinbakker, hopp- og skiskytteranlegg</text>
<rect x="240" y="248" width="81.1" height="20" fill="#1f5f99"/>
<text x="329.1" y="263" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">890 anlegg</text>
<line x1="240" x2="240" y1="98" y2="276" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="312" y2="312" stroke="#dcded8" stroke-width="1"/>
<text x="24" y="330" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Kilde: Kultur- og likestillingsdepartementet (Anleggsregisteret)</text>
<text x="736" y="330" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16191c">tidsrøst</text>
</svg>