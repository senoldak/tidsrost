<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Frivillige årsverk etter organisasjonsfelt">
<title>Frivillige årsverk etter organisasjonsfelt</title>
<rect width="760" height="350" fill="#fdfdfb"/>
<rect x="0" y="0" width="760" height="2" fill="#16191c"/>
<text x="24" y="40" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="650" fill="#16191c">Frivillige årsverk etter organisasjonsfelt</text>
<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Fordeling av 142 000 frivillige årsverk i Norge</text>
<text x="230" y="119" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Idrett og friluftsliv</text>
<rect x="240" y="104" width="332.6" height="20" fill="#16191c"/>
<text x="580.6" y="119" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">36,5 %</text>
<text x="230" y="155" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Kultur, musikk og kunst</text>
<rect x="240" y="140" width="191.3" height="20" fill="#1f5f99"/>
<text x="439.3" y="155" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">21,0 %</text>
<text x="230" y="191" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Sosiale tjenester og beredskap</text>
<rect x="240" y="176" width="144.0" height="20" fill="#1f5f99"/>
<text x="392.0" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">15,8 %</text>
<text x="230" y="227" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Borettslag, velforeninger og nærmiljø</text>
<rect x="240" y="212" width="129.4" height="20" fill="#1f5f99"/>
<text x="377.4" y="227" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">14,2 %</text>
<text x="230" y="263" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Tro, livssyn og internasjonalt arbeid</text>
<rect x="240" y="248" width="113.9" height="20" fill="#1f5f99"/>
<text x="361.9" y="263" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">12,5 %</text>
<line x1="240" x2="240" y1="98" y2="276" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="312" y2="312" stroke="#dcded8" stroke-width="1"/>
<text x="24" y="330" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Kilde: SSB, satellittregnskap for ideelle og frivillige organisasjoner</text>
<text x="736" y="330" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16191c">tidsrøst</text>
</svg>