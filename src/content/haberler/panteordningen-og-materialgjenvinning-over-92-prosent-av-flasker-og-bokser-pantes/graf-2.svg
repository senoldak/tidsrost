<text x="584.6" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">82,1 %</text>
<text x="230" y="227" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Elektrisk og elektronisk avfall (EE)</text>
<rect x="240" y="212" width="321.9" height="20" fill="#1f5f99"/>
<text x="569.9" y="227" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">78,5 %</text>
<line x1="240" x2="240" y1="98" y2="240" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="276" y2="276" stroke="#dcded8" stroke-width="1"/>
