<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" role="img" aria-label="Innlogginger via ID-porten etter tjenesteområde (2025)">
<title>Innlogginger via ID-porten etter tjenesteområde (2025)</title>
<rect width="760" height="314" fill="#fdfdfb"/>
<rect x="0" y="0" width="760" height="2" fill="#16191c"/>
<text x="24" y="40" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="650" fill="#16191c">Innlogginger via ID-porten etter tjenesteområde (2025)</text>
<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Andel av over 310 millioner sikre innlogginger til offentlige tjenester</text>
<text x="230" y="119" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Helsenorge og helsetjenester</text>
<rect x="240" y="104" width="348.5" height="20" fill="#16191c"/>
<text x="596.5" y="119" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">42,5 %</text>
<text x="230" y="155" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Skatteetaten og Folkeregisteret</text>
<rect x="240" y="140" width="203.4" height="20" fill="#1f5f99"/>
<text x="451.4" y="155" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">24,8 %</text>
<text x="230" y="191" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Nav (arbeid og velferd)</text>
<rect x="240" y="176" width="149.2" height="20" fill="#1f5f99"/>
<text x="397.2" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">18,2 %</text>
<text x="230" y="227" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Altinn og kommunale tjenester</text>
<rect x="240" y="212" width="118.9" height="20" fill="#1f5f99"/>
<text x="366.9" y="227" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">14,5 %</text>
<line x1="240" x2="240" y1="98" y2="240" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="276" y2="276" stroke="#dcded8" stroke-width="1"/>
<text x="24" y="294" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Kilde: Digitaliseringsdirektoratet (Digdir)</text>
<text x="736" y="294" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16191c">tidsrøst</text>
</svg>