<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Nyetableringer etter næringshovedområde i 2025">
<title>Nyetableringer etter næringshovedområde i 2025</title>
<rect width="760" height="350" fill="#fdfdfb"/>
<rect x="0" y="0" width="760" height="2" fill="#16191c"/>
<text x="24" y="40" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="650" fill="#16191c">Nyetableringer etter næringshovedområde i 2025</text>
<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Andel av de nyregistrerte foretakene i Norge</text>
<text x="230" y="119" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Faglig, vitenskapelig og teknisk tjenesteyting</text>
<rect x="240" y="104" width="292.5" height="20" fill="#16191c"/>
<text x="540.5" y="119" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">21,4 %</text>
<text x="230" y="155" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Bygge- og anleggsvirksomhet</text>
<rect x="240" y="140" width="194.1" height="20" fill="#1f5f99"/>
<text x="442.1" y="155" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">14,2 %</text>
<text x="230" y="191" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Varehandel og verkstedtjenester</text>
<rect x="240" y="176" width="184.5" height="20" fill="#1f5f99"/>
<text x="432.5" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">13,5 %</text>
<text x="230" y="227" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Informasjon, IT og kommunikasjon</text>
<rect x="240" y="212" width="161.3" height="20" fill="#1f5f99"/>
<text x="409.3" y="227" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">11,8 %</text>
<text x="230" y="263" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Helse-, omsorgs- og kulturvirksomhet</text>
<rect x="240" y="248" width="144.9" height="20" fill="#1f5f99"/>
<text x="392.9" y="263" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">10,6 %</text>
<line x1="240" x2="240" y1="98" y2="276" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="312" y2="312" stroke="#dcded8" stroke-width="1"/>
