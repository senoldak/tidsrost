<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="Deltakelse i friluftslivsaktiviteter i befolkningen">
<title>Deltakelse i friluftslivsaktiviteter i befolkningen</title>
<rect width="760" height="350" fill="#fdfdfb"/>
<rect x="0" y="0" width="760" height="2" fill="#16191c"/>
<text x="24" y="40" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="650" fill="#16191c">Deltakelse i friluftslivsaktiviteter i befolkningen</text>
<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Andel av befolkningen (16 år og over) som har deltatt siste tolv måneder</text>
<text x="230" y="119" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Fottur i skog, mark eller fjell</text>
<rect x="240" y="104" width="364.9" height="20" fill="#16191c"/>
<text x="612.9" y="119" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">89,0 %</text>
<text x="230" y="155" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Bading utendørs i sjø eller vann</text>
<rect x="240" y="140" width="278.8" height="20" fill="#1f5f99"/>
<text x="526.8" y="155" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">68,0 %</text>
<text x="230" y="191" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Skitur i skog eller på fjellet</text>
<rect x="240" y="176" width="180.4" height="20" fill="#1f5f99"/>
<text x="428.4" y="191" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">44,0 %</text>
<text x="230" y="227" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Bær- eller sopptur</text>
<rect x="240" y="212" width="172.2" height="20" fill="#1f5f99"/>
<text x="420.2" y="227" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">42,0 %</text>
<text x="230" y="263" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16191c">Fisketur i sjø, elv eller vann</text>
<rect x="240" y="248" width="159.9" height="20" fill="#1f5f99"/>
<text x="407.9" y="263" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#16191c">39,0 %</text>
<line x1="240" x2="240" y1="98" y2="276" stroke="#16191c" stroke-width="1"/>
<line x1="24" x2="736" y1="312" y2="312" stroke="#dcded8" stroke-width="1"/>
<text x="24" y="330" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Kilde: SSB, levekårsundersøkelsen om idrett og friluftsliv</text>
<text x="736" y="330" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16191c">tidsrøst</text>
</svg>