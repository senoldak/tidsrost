<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" role="img" aria-label="Tilbakefall innen to år etter gjennomført straff, 2022">
<title>Tilbakefall innen to år etter gjennomført straff, 2022</title>
<rect width="760" height="332" fill="#fdfdfb"/>
<rect x="0" y="0" width="760" height="2" fill="#16191c"/>
<text x="24" y="40" font-family="'Source Serif 4', Georgia, serif" font-size="22" font-weight="650" fill="#16191c">Tilbakefall innen to år etter gjennomført straff, 2022</text>
<text x="24" y="66" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2f353a">Andel som får ny dom, etter straffegjennomføringsform</text>
<text x="24" y="92" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Prosent</text>
<text x="24" y="121" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2f353a">Narkotikaprogram med domstolskontroll</text>
<rect x="324" y="108" width="366" height="20" fill="#1f5f99"/>
<text x="696" y="122" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#16191c">23 %</text>
<text x="24" y="155" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2f353a">Fengsel (hele straffen i fengsel)</text>
<rect x="324" y="142" width="302.3" height="20" fill="#1f5f99"/>
<text x="632.3" y="156" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#16191c">19 %</text>
<text x="24" y="189" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2f353a">Samfunnsstraff</text>
<rect x="324" y="176" width="159.1" height="20" fill="#1f5f99"/>
<text x="489.1" y="190" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#16191c">10 %</text>
<text x="24" y="223" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2f353a">Elektronisk kontroll, delgjennomføring</text>
<rect x="324" y="210" width="127.3" height="20" fill="#1f5f99"/>
<text x="457.3" y="224" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#16191c">8 %</text>
<text x="24" y="257" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#2f353a">Elektronisk kontroll, helgjennomføring</text>
<rect x="324" y="244" width="79.6" height="20" fill="#1f5f99"/>
<text x="409.6" y="258" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#16191c">5 %</text>
<line x1="24" x2="736" y1="292" y2="292" stroke="#dcded8" stroke-width="1"/>
<text x="24" y="310" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5a6168">Kilde: Kriminalomsorgsdirektoratet, årsrapport 2025</text>
<text x="736" y="310" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#16191c">tidsrøst</text>
</svg>
