# Sveltia CMS-innstillinger: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: senoldak/tidsrost
  branch: main

site_url: https://tidsrost.com
display_url: https://tidsrost.com
locale: nb

# Opplastede mediefiler
media_folder: /public/uploads
public_folder: /uploads

# Bildebehandling ved opplasting (konverteres automatisk til WebP)
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000

slug:
  encoding: ascii
  clean_accents: true

output:
  omit_empty_optional_fields: true

collections:
  - name: haberler
    label: Nyheter
    label_singular: Nyhetssak
    folder: src/content/haberler
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{title}}'
    summary: '{{title}} · {{date | date("DD.MM.YYYY HH:mm")}}'
    sortable_fields:
      fields: [date, title, category]
      default:
        field: date
        direction: descending
    view_filters:
      - { label: Toppsak, field: featured, pattern: true }
      - { label: Siste nytt, field: breaking, pattern: true }
      - { label: Utkast, field: draft, pattern: true }
    view_groups:
      - { label: Kategori, field: category }
    fields:
      - { name: title, label: Tittel, widget: string }
      - name: description
        label: Ingress
        widget: text
        hint: Kort sammendrag på 1–2 setninger som vises på forsiden og ved deling.
      - name: category
        label: Kategori
        widget: select
        default: innenriks
        options:
          - { label: Innenriks, value: innenriks }
          - { label: Utenriks, value: utenriks }
          - { label: Økonomi, value: okonomi }
          - { label: Sport, value: sport }
          - { label: Kultur, value: kultur }
          - { label: Teknologi, value: teknologi }
      - { name: date, label: Publiseringstidspunkt, widget: datetime, default: '{{now}}', input_timezone: Europe/Oslo }
      - { name: cover, label: Forsidebilde, widget: image, required: false }
      - { name: coverAlt, label: Bildetekst / alt-tekst, widget: string, required: false }
      - { name: coverKreditt, label: Bildekreditt, widget: string, required: false, hint: 'F.eks. Foto: Ola Nordmann / NTB. Vises under bildet.' }
      - { name: author, label: Forfatter, widget: string, default: tidsrøst }
      - name: featured
        label: Toppsak
        widget: boolean
        default: false
        hint: Vises som hovedoppslag øverst på forsiden.
      - name: breaking
        label: Siste nytt (breaking)
        widget: boolean
        default: false
        hint: Vises i det røde Siste nytt-båndet øverst på forsiden.
      - name: draft
        label: Utkast
        widget: boolean
        default: false
        hint: Hvis avkrysset, publiseres ikke saken på nettsiden.
      - name: produksjon
        label: Produksjonsform
        widget: select
        default: manuell
        hint: Opplyser om hvordan saken er utarbeidet (VVP 2.3).
        options:
          - { label: Egenskrevet / manuell, value: manuell }
          - { label: Automatisk datatjeneste, value: automatisk }
          - { label: 'KI-assistert (utarbeidet med KI-støtte, redaksjonelt kvalitetssikret)', value: ki-assistert }
          - { label: 'KI-kontrollert (gjennomgått redaksjonelt)', value: ki-kontrollert }
          - { label: 'KI-automatisk', value: ki-automatisk }
      - name: rettelse
        label: Rettelsesmerknad
        widget: text
        required: false
        hint: Dersom en feil er rettet etter publisering, beskrives rettelsen her (VVP 4.13). Vises øverst i saken.
      - { name: oppdatert, label: Oppdatert tidspunkt, widget: datetime, required: false, input_timezone: Europe/Oslo, hint: 'Oppgis ved oppdateringer eller rettelser. Vises som Oppdatert i saken og i søkemotor-metadata.' }
      - { name: body, label: Brødtekst, widget: markdown }
